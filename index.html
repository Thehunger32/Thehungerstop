<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>The Hunger Stop – Hunger Ka Full Stop | Lucknow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* RANG: warm ink background, ivory text, antique gold (flat, no neon) */
:root{--bg:#fff;--card:#fff;--line:#e6e8ec;--gold:#b87a00;--amb:#f5b400;--tx:#14161a;--mut:#6b7280;--ok:#1f9d55;--wa:#1fa855;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'Inter','Noto Sans Devanagari','Mukta',system-ui,sans-serif;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-weight:800;letter-spacing:-.2px}h2{font-size:26px;margin-bottom:12px}h3{font-size:17px}
.gold{color:var(--gold)}small{color:var(--mut)}
#splash{position:fixed;inset:0;background:#fff;z-index:99;display:grid;place-items:center;text-align:center;transition:opacity .8s}
#splash img{width:60vw;max-width:260px;animation:pop 1.4s ease both}#splash p{margin-top:16px;letter-spacing:4px;color:var(--gold);font-size:12px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fffffff2;backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header img{width:52px;height:52px;border-radius:50%}header b{display:block;font-size:20px;font-weight:800}
.badge{border:1px solid var(--line);border-radius:10px;padding:5px 11px;text-align:center;color:var(--gold);font-weight:700;line-height:1.25;font-size:11px;letter-spacing:1.5px}
.page{padding:16px}.cap{color:var(--mut);font-weight:600;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.btn{width:100%;display:block;font:inherit;font-weight:700;font-size:18px;border-radius:14px;padding:18px 12px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:12px;text-align:center;text-decoration:none}
.btn.p{background:var(--amb);color:#16110a;border-color:var(--gold);font-size:22px;padding:26px 12px}
.btn.o{background:none;border-color:var(--gold);color:var(--gold)}.btn small{display:block;font-weight:500;font-size:.72em;opacity:.8;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0000000d}
.two{display:flex;gap:10px}.two>*{flex:1}.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.lg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.lg button,.chip{font:inherit;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.lg button.on,.chip.on{background:var(--amb);color:#16110a;border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}.chip{flex:none;border-radius:99px}
.item{display:flex;gap:14px;margin:0 16px 12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;align-items:center;box-shadow:0 1px 4px #0000000d}
.item.off{opacity:.45}.ic{flex:none;width:54px;height:54px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:22px}
.t{flex:1}.pr{color:var(--gold);font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ok);border-radius:3px;margin-right:6px;position:relative}.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ok)}
.add{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:9px 18px;font:inherit;font-weight:700}
.qty{display:flex;align-items:center;gap:10px;background:var(--amb);color:#16110a;border-radius:10px;padding:3px 8px;font-weight:700}.qty button{background:none;border:0;font-size:20px;width:26px;color:inherit}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:532px;z-index:30;border:0;border-radius:14px;padding:17px;background:var(--amb);color:#16110a;font:inherit;font-weight:700;display:flex;justify-content:space-between}
input,textarea{width:100%;background:#f7f8fa;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px;font:inherit;margin-bottom:10px}
.back{background:none;border:0;color:var(--gold);font:inherit;font-weight:600;margin:0 0 10px}
.step{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--mut)}.step i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.step.done{color:var(--tx)}.step.done i{background:var(--amb);border-color:var(--gold)}.step.now{color:var(--gold);font-weight:700}.step.now i{border-color:var(--gold);box-shadow:0 0 0 4px #f5b40044}
.tag{border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--gold)}
.ver{text-align:center;color:var(--mut);letter-spacing:2px;margin-top:20px;font-size:13px}.ver a{color:var(--gold);padding:6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px;color:var(--gold)}
.bill{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:18px}.bill hr{border:0;border-top:1px dashed #999;margin:10px 0}
@media print{header,#nv,#cb,.noprint,.back,.lg,.btn,.chips{display:none!important}.card,.bill{box-shadow:none}}
header{flex-wrap:wrap}#nv{flex:0 0 100%;display:flex;margin:6px -16px -12px;border-top:1px solid var(--line)}#nv:empty{display:none}
#nv a{flex:1;text-align:center;padding:12px 2px;font-weight:600;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center}#nv a.on{color:var(--gold);box-shadow:inset 0 -3px 0 var(--amb)}
.wt{position:fixed;left:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:8px;background:#14161a;color:#fff;border:2px solid var(--amb);border-radius:99px;padding:12px 18px;font:inherit;font-weight:700;box-shadow:0 6px 20px #0003}.wt.up{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.note{background:#fff8e1;border:1px solid var(--amb);border-radius:10px;padding:9px 11px;margin:8px 0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tq{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px}.tq div{display:inline-block}
.btn.sm{font-size:15px;padding:12px;margin:0}.ib{display:flex;align-items:center;justify-content:center;gap:8px}.two{flex-wrap:wrap}

.ph{flex:none;width:58px;height:58px;border-radius:12px;object-fit:cover}.dot.nv{border-color:#d33}.dot.nv::after{background:#d33}
.lt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font:inherit;font-weight:700;color:var(--gold)}
.st{background:none;border:0;font-size:40px;color:var(--amb);padding:0 4px}
.stamps{display:flex;gap:6px;margin:10px 0}.stamps span{flex:1;aspect-ratio:1;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--mut)}.stamps span.on{background:var(--gold);border:0;color:#fff}.stamps span.gift{border-color:var(--amb);color:var(--gold)}

/* premium polish (colors & sound unchanged) */
body{-webkit-font-smoothing:antialiased}.page{animation:fin .35s ease}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{border-radius:18px;box-shadow:0 4px 18px #0000000d}.item{border-radius:18px;box-shadow:0 4px 18px #0000000d;transition:transform .15s}.item:active{transform:scale(.99)}
.btn{transition:transform .12s,box-shadow .2s}.btn:active{transform:scale(.98)}.btn.p{box-shadow:0 8px 20px #f5b40055}
h2{letter-spacing:-.4px}.cap{letter-spacing:2.2px}
.flow{display:flex;margin:4px 0 18px}.flow div{flex:1;text-align:center;font-size:12px;color:var(--mut);font-weight:600}.flow i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 5px;border-radius:50%;border:2px solid var(--line);font-style:normal;font-weight:700;background:#fff}.flow .on{color:var(--gold)}.flow .on i{background:var(--amb);border-color:var(--amb);color:#14161a}
.ok{text-align:center;background:#e8f6ee;border:1px solid #9fd5b4;border-radius:18px;padding:22px 16px;margin-bottom:14px}.ok small{color:#3d6b52}.ok .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.tick{width:66px;height:66px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 12px;animation:pp .5s cubic-bezier(.2,1.5,.4,1)}@keyframes pp{from{transform:scale(0)}to{transform:scale(1)}}
.pc{padding:20px}.big2{font-size:42px;font-weight:800;color:var(--gold);letter-spacing:-1px;margin:2px 0 12px}.mth{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.note2{color:var(--mut);font-size:13px;text-align:center;margin:4px 8px 12px}
</style></head><body>
