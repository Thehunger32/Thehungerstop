<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c0a">
<title>The Hunger Stop – Hunger Ka Full Stop | Lucknow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* RANG: warm ink background, ivory text, antique gold (flat, no neon) */
:root{--bg:#0e0c0a;--card:#16130f;--line:#2b261d;--gold:#bf9d5e;--tx:#eee7d6;--mut:#8d8470;--ok:#6aa686;--wa:#2f7d5b;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.5 'Inter','Noto Sans Devanagari','Mukta',system-ui,sans-serif;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-weight:800;letter-spacing:-.2px}h2{font-size:26px;margin-bottom:12px}h3{font-size:17px}
.gold{color:var(--gold)}small{color:var(--mut)}
#splash{position:fixed;inset:0;background:#000;z-index:99;display:grid;place-items:center;text-align:center;transition:opacity .8s}
#splash img{width:60vw;max-width:260px;animation:pop 1.4s ease both}#splash p{margin-top:16px;letter-spacing:4px;color:var(--gold);font-size:12px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0e0c0aee;backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--gold)}
header img{width:52px;height:52px;border-radius:50%}header b{display:block;font-size:20px;font-weight:800}
.badge{border:1px solid var(--line);border-radius:10px;padding:5px 11px;text-align:center;color:var(--gold);font-weight:700;line-height:1.25;font-size:11px;letter-spacing:1.5px}
.page{padding:16px}.cap{color:var(--mut);font-weight:600;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.btn{width:100%;display:block;font:inherit;font-weight:700;font-size:18px;border-radius:14px;padding:18px 12px;border:1px solid var(--line);background:var(--card);color:var(--tx);margin-bottom:12px;text-align:center;text-decoration:none}
.btn.p{background:var(--gold);color:#16110a;border-color:var(--gold);font-size:22px;padding:26px 12px}
.btn.o{background:none;border-color:var(--gold);color:var(--gold)}.btn small{display:block;font-weight:500;font-size:.72em;opacity:.8;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.two{display:flex;gap:10px}.two>*{flex:1}.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.lg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.lg button,.chip{font:inherit;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.lg button.on,.chip.on{background:var(--gold);color:#16110a;border-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}.chip{flex:none;border-radius:99px}
.item{display:flex;gap:14px;margin:0 16px 12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;align-items:center}
.item.off{opacity:.45}.ic{flex:none;width:54px;height:54px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:22px}
.t{flex:1}.pr{color:var(--gold);font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ok);border-radius:3px;margin-right:6px;position:relative}.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ok)}
.add{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:9px 18px;font:inherit;font-weight:700}
.qty{display:flex;align-items:center;gap:10px;background:var(--gold);color:#16110a;border-radius:10px;padding:3px 8px;font-weight:700}.qty button{background:none;border:0;font-size:20px;width:26px;color:inherit}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:532px;z-index:30;border:0;border-radius:14px;padding:17px;background:var(--gold);color:#16110a;font:inherit;font-weight:700;display:flex;justify-content:space-between}
input,textarea{width:100%;background:#0b0907;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px;font:inherit;margin-bottom:10px}
.back{background:none;border:0;color:var(--gold);font:inherit;font-weight:600;margin:0 0 10px}
.step{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--mut)}.step i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.step.done{color:var(--tx)}.step.done i{background:var(--gold);border-color:var(--gold)}.step.now{color:var(--gold);font-weight:700}.step.now i{border-color:var(--gold);box-shadow:0 0 0 4px #bf9d5e33}
.tag{border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--gold)}
.ver{text-align:center;color:var(--mut);letter-spacing:2px;margin-top:20px;font-size:13px}.ver a{color:var(--gold);padding:6px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px;color:var(--gold)}
.bill{background:#fff;color:#111;border-radius:12px;padding:18px}.bill hr{border:0;border-top:1px dashed #999;margin:10px 0}
@media print{body *{visibility:hidden}.bill,.bill *{visibility:visible}.bill{position:absolute;left:0;top:0;width:100%}}
</style></head><body>

function go(v,r){view=v;if(r)lr=r;draw();scrollTo(0,0)}
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);draw()}
function login(){if($('#pn').value==PIN[lr]){role=lr;try{sessionStorage.setItem('hs_role',lr)}catch(e){}go(lr)}else{alert('Galat PIN')}}
function out(){role=null;try{sessionStorage.removeItem('hs_role')}catch(e){}go('home')}
function adv(id){const l=orders();const o=l.find(x=>x.id==id);if(o.st<4){o.st++;if(o.st==3)o.t3=Date.now()}sv('hs_orders',l);draw()}
function setP(i,v){const m=ov();m[i]=Object.assign(m[i]||{},{p:Math.max(0,+v||0)});sv('hs_menu',m);draw()}
function setOff(i){const m=ov();m[i]=Object.assign(m[i]||{},{off:!OFF(i)});sv('hs_menu',m);draw()}
function clr(){if(confirm('Saare orders delete karein?')){sv('hs_orders',[]);draw()}}
function place(d){const nm=$('#nm').value.trim(),ph=$('#ph').value.trim(),ad=$('#ad').value.trim();if(!nm||ph.length<10||!ad){alert('Naam, 10-digit mobile aur address bharein.');return}
const o={id:'HS-'+(1001+orders().length),t:Date.now(),pay,nm,ph,ad,items:Object.keys(cart).filter(k=>cart[k]).map(k=>[+k,cart[k]]),total:tot()+d,st:0};const l=orders();l.push(o);sv('hs_orders',l);sv('hs_last',o.id);cart={};go('track')}
const bz=(p,t)=>{const u=1-t;return[0,1].map(k=>u*u*u*p[0][k]+3*u*u*t*p[1][k]+3*u*t*t*p[2][k]+t*t*t*p[3][k])};
const rider=p=>p<.5?bz([[30,160],[90,160],[80,90],[150,100]],p*2):bz([[150,100],[220,110],[250,60],[300,40]],(p-.5)*2);
const V={
home:()=>`<div class="page"><button class="btn p" onclick="go('menu')">${t('new')}</button><button class="btn" onclick="go('track')">${t('past')}</button><button class="btn o" onclick="go('track')">${t('trk')}</button>
<div class="card" style="text-align:center"><div class="cap">${t('sup')}</div><div class="two" style="margin-top:14px"><a class="btn" style="background:var(--wa);border-color:var(--wa);margin:0" href="https://wa.me/${WA}">${t('wa')}</a><a class="btn o" style="margin:0" href="tel:${PH}">${t('cl')}</a></div></div>
<div class="cap" style="text-align:center;margin:24px 0 12px">भाषा / Language</div><div class="lg"><button class="${L=='hi'?'on':''}" onclick="setL('hi')">हिंदी</button><button class="${L=='en'?'on':''}" onclick="setL('en')">English</button><button class="${L=='both'?'on':''}" onclick="setL('both')">हिंदी ⇄ English</button></div>
<p class="ver">Version 1<br><a onclick="go('login','counter')">Counter Login</a>·<a onclick="go('login','admin')">Admin Login</a></p></div>`,
menu:()=>`<div class="page" style="padding-bottom:0"><button class="back" onclick="go('home')">← Home</button><h2>Menu</h2><small>Pure veg · Lucknow</small></div><div class="chips">${CATS.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div>`+
MENU.map((m,i)=>m[0]!=cat?'':`<div class="item ${OFF(i)?'off':''}"><div class="ic">${m[1][0]}</div><div class="t"><h3><span class="dot"></span>${m[1]}</h3><small>${m[3]}</small><div class="pr">${R(P(i))}</div></div>${OFF(i)?'<small>Not available</small>':cart[i]?`<div class="qty"><button onclick="ch(${i},-1)">−</button>${cart[i]}<button onclick="ch(${i},1)">+</button></div>`:`<button class="add" onclick="ch(${i},1)">ADD</button>`}</div>`).join('')+`<p class="ver" style="letter-spacing:0">Demo rates – final rates confirm hone par badlenge</p>`,
cart:()=>{const ids=Object.keys(cart).filter(k=>cart[k]),d=tot()>=299?0:30;return`<div class="page"><button class="back" onclick="go('menu')">← Menu</button><h2>Your Cart</h2>${ids.length?`<div class="card">${ids.map(k=>`<div class="row"><span>${MENU[k][1]} × ${cart[k]}</span><b>${R(P(k)*cart[k])}</b></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line);margin:8px 0"><div class="row"><span>Delivery</span><span>${d?R(d):'FREE'}</span></div><div class="row"><b>Total</b><b class="gold">${R(tot()+d)}</b></div></div>
<input id="nm" placeholder="Aapka naam"><input id="ph" type="tel" placeholder="Mobile number"><textarea id="ad" rows="2" placeholder="Poora address, landmark"></textarea>
<div class="lg" style="margin-bottom:14px"><button class="${pay=='cod'?'on':''}" onclick="pay='cod';draw()">Cash on Delivery</button><button class="${pay=='upi'?'on':''}" onclick="pay='upi';draw()">UPI / Online</button></div><button class="btn p" style="font-size:18px;padding:18px" onclick="place(${d})">Place Order · ${R(tot()+d)}</button>`:'<div class="card">Cart khali hai.</div>'}</div>`},
track:()=>{const o=orders().find(x=>x.id==g('hs_last',''));if(!o)return`<div class="page"><button class="back" onclick="go('home')">← Home</button><h2>Tracking</h2><div class="card">Abhi koi order nahi.</div></div>`;
const p=o.st<3?0:o.st>3?1:Math.min(.92,(Date.now()-(o.t3||o.t))/45000),[x,y]=rider(p);
return`<div class="page"><button class="back" onclick="go('home')">← Home</button><h2>Order <span class="gold">${o.id}</span></h2><div class="card"><svg viewBox="0 0 340 200" width="100%" style="border-radius:10px;background:#0b0907"><path d="M0 120H340M120 0V200M240 0V200M0 50H340" stroke="#1a1610" stroke-width="10"/><path d="M30 160C90 160 80 90 150 100S250 60 300 40" fill="none" stroke="#bf9d5e" stroke-width="2" stroke-dasharray="5 6"/><text x="30" y="186" fill="#8d8470" font-size="11" text-anchor="middle">Hunger Stop</text><text x="300" y="28" fill="#8d8470" font-size="11" text-anchor="middle">Aapka ghar</text><circle cx="${x}" cy="${y}" r="13" fill="#bf9d5e33"/><circle cx="${x}" cy="${y}" r="6" fill="#bf9d5e"/></svg>
<div class="row" style="margin-top:8px"><b>${o.st==4?'Delivered. Enjoy!':o.st==3?'Rider raaste mein hai':'Aapka order taiyaar ho raha hai'}</b><span class="tag">${o.pay=='cod'?'COD':'UPI'}</span></div></div>
<div class="card">${STAT.map((s,i)=>`<div class="step ${i<=o.st&&o.st==4||i<o.st?'done':''} ${i==o.st&&o.st<4?'now':''}"><i></i>${s}</div>`).join('')}</div>
<div class="card"><small>${txt(o)}</small><div class="row"><span>Total</span><b class="gold">${R(o.total)}</b></div></div>
<a class="btn" style="background:var(--wa);border-color:var(--wa)" href="https://wa.me/${WA}?text=${encodeURIComponent('Order '+o.id+' | '+txt(o)+' | Total '+R(o.total)+' | '+o.nm+', '+o.ad)}">Order WhatsApp par bhejein</a><div class="two"><a class="btn o" href="tel:${PH}">Call Support</a><button class="btn o" onclick="bid='${o.id}';go('bill')">Bill</button></div></div>`},
login:()=>`<div class="page"><button class="back" onclick="go('home')">← Home</button><h2>${lr=='admin'?'Admin':'Counter'} Login</h2><div class="card"><div class="cap" style="margin-bottom:10px">Enter PIN</div><input id="pn" type="password" inputmode="numeric" placeholder="••••"><button class="btn p" style="font-size:18px;padding:16px;margin:0" onclick="login()">Login</button></div><small>Demo PIN: Counter 1111 · Admin 9999 (asli version mein email + password)</small></div>`,
counter:()=>{const l=orders().slice().reverse().filter(o=>cf=='open'?o.st<4:o.st==4);return`<div class="page"><div class="row"><h2>Counter</h2><button class="back" onclick="out()">Logout</button></div><div class="lg" style="margin-bottom:14px"><button class="${cf=='open'?'on':''}" onclick="cf='open';draw()">Active</button><button class="${cf=='done'?'on':''}" onclick="cf='done';draw()">Delivered</button></div>${l.length?l.map(o=>`<div class="card"><div class="row"><b class="gold">${o.id}</b><small>${when(o)}</small></div><div><b>${o.nm}</b> · <a style="color:var(--gold)" href="tel:${o.ph}">${o.ph}</a></div><small>${o.ad}</small><p style="margin:8px 0">${txt(o)}</p><div class="row"><b>${R(o.total)} <span class="tag">${o.pay=='cod'?'COD':'UPI'}</span></b><span class="tag">${STAT[o.st]}</span></div><div class="two" style="margin-top:10px">${o.st<4?`<button class="btn p" style="font-size:15px;padding:13px;margin:0" onclick="adv('${o.id}')">→ ${STAT[o.st+1]}</button>`:''}<button class="btn o" style="font-size:15px;padding:13px;margin:0" onclick="bid='${o.id}';go('bill')">Bill</button></div></div>`).join(''):'<div class="card">Koi order nahi.</div>'}</div>`},
admin:()=>{const l=orders(),rev=l.reduce((s,o)=>s+o.total,0);return`<div class="page"><div class="row"><h2>Admin</h2><button class="back" onclick="out()">Logout</button></div><div class="lg" style="margin-bottom:14px"><button class="${tab=='ov'?'on':''}" onclick="tab='ov';draw()">Overview</button><button class="${tab=='mn'?'on':''}" onclick="tab='mn';draw()">Menu & Rates</button></div>`+(tab=='ov'?`<div class="two" style="margin-bottom:12px"><div class="stat"><small>Orders</small><b>${l.length}</b></div><div class="stat"><small>Sales</small><b>${R(rev)}</b></div><div class="stat"><small>Active</small><b>${l.filter(o=>o.st<4).length}</b></div></div>${l.slice().reverse().map(o=>`<div class="card"><div class="row"><b class="gold">${o.id}</b><span class="tag">${STAT[o.st]}</span></div><small>${o.nm} · ${when(o)}</small><div class="row"><span>${txt(o)}</span><b>${R(o.total)}</b></div></div>`).join('')||'<div class="card">Abhi koi order nahi.</div>'}<button class="btn o" onclick="clr()">Clear all orders</button>`:MENU.map((m,i)=>`<div class="card"><div class="row"><b>${m[1]}</b><button class="tag" style="background:none" onclick="setOff(${i})">${OFF(i)?'Unavailable':'Available'}</button></div><div class="row" style="align-items:center"><small>${m[0]} · Rate ₹</small><input type="number" style="width:110px;margin:0;padding:8px" value="${P(i)}" onchange="setP(${i},this.value)"></div></div>`).join(''))+`</div>`},
bill:()=>{const o=orders().find(x=>x.id==bid);if(!o)return V.home();return`<div class="page"><button class="back" onclick="go(role?'counter':'track')">← Back</button><div class="bill"><h3 style="text-align:center">THE HUNGER STOP™</h3><small style="display:block;text-align:center;color:#555">Hunger Ka Full Stop · Lucknow · ${PH}</small><hr>${o.items.map(([i,q])=>`<div class="row"><span>${MENU[i][1]} × ${q}</span><span>${R(P(i)*q)}</span></div>`).join('')}<hr><div class="row"><b>Total (incl. delivery)</b><b>${R(o.total)}</b></div><small style="color:#555">${o.id} · ${when(o)} · ${o.pay=='cod'?'Cash on Delivery':'UPI'}<br>${o.nm}, ${o.ad}</small><p style="text-align:center;margin-top:10px">Thank you! Phir milenge.</p></div><button class="btn p" style="font-size:18px;padding:16px;margin-top:14px" onclick="print()">Print Bill</button></div>`}};
function draw(){clearInterval(window.tk);let v=view;if((v=='counter'||v=='admin')&&role!=v)v='login';$('#app').innerHTML=V[v]();$('#sub').innerHTML=t('wel');
$('#cb').innerHTML=v=='menu'&&cnt()?`<button class="bar" onclick="go('cart')"><span>${cnt()} item</span><span>View cart · ${R(tot())} →</span></button>`:'';
if(v=='track'||v=='counter')window.tk=setInterval(()=>{if(view==v&&!document.activeElement.matches('input'))$('#app').innerHTML=V[v]()},2000)}
const q=location.search;if(q.includes('admin'))view='admin',lr='admin';else if(q.includes('counter'))view='counter',lr='counter';
draw();setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),800)},2000);
</script></body></html>
